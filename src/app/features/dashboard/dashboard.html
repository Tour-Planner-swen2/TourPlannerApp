<div class="absolute inset-0 bg-white p-4 md:p-6 flex flex-col gap-4 md:gap-6 box-border overflow-hidden">

  <div class="w-full h-24 md:h-28 shrink-0 border-4 border-black rounded-[2.5rem] p-4">
    <app-search-bar>

    </app-search-bar>
  </div>

  <div class="flex-1 flex flex-col md:flex-row gap-4 md:gap-6 min-h-0">

    <div class="w-full md:w-1/5 h-[250px] md:h-full border-4 border-black rounded-[2.5rem] p-4 flex flex-col gap-3 overflow-y-auto">
      <app-tour-list>

      </app-tour-list>
      <div
        (dblclick)="openModal(null)"
        class="w-full shrink-0 min-h-[80px] border-2 border-black rounded-[1rem] flex justify-center items-center cursor-pointer transition-all hover:border-blue-500 hover:ring-2 hover:ring-blue-500 hover:text-blue-500 group bg-transparent"
      >
        <span class="text-4xl font-light transition-transform group-hover:scale-110">+</span>
      </div>
    </div>

    <div class="w-full md:w-4/5 flex flex-col gap-4 md:gap-6 flex-1 min-h-0">

      <div class="w-full flex-3 min-h-[200px] md:min-h-0 border-4 border-black rounded-[2.5rem] p-4">
        <app-map></app-map>
      </div>

      <div class="w-full flex-2 min-h-[200px] md:min-h-0 border-4 border-black rounded-[2.5rem] p-4">
        <app-tour-details></app-tour-details>
      </div>

    </div>
  </div>

</div>

@if (modalTour) {
  <div
    (click)="closeModal()"
    class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">

    <div
      (click)="$event.stopPropagation()"
      class="w-full max-w-xl relative z-[101]">

      <app-tour-list-item-modal
        [tour]="modalTour"
        (onCancel)="closeModal()"
        (onSave)="saveTourChanges($event)">
      </app-tour-list-item-modal>

    </div>
  </div>
}
