<div class="align-center"></div>
<app-custom-button
  label="Double-click for Tour Info"
  (dblclick)="openModal()">
</app-custom-button>

@if (isModalOpen()) {
  <div
    (click)="closeModal()"
    class="fixed inset-0 bg-black/50 z-40 flex items-center justify-center">

    <div
      (click)="$event.stopPropagation()"
      class="bg-white rounded-lg shadow-xl w-full max-w-md relative z-50">

      <app-tour-list-item-modal
        [tour]="tour"
        (onCancel)="closeModal()"
        (onSave)="saveTourChanges($event)">
      </app-tour-list-item-modal>

    </div>
  </div>
}
