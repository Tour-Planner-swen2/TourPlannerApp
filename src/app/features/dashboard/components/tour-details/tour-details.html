@if (activeTour() !== null) {
  @if (hasPrevious) {
    <button
      (click)="previousGroup()"
      class="px-4 py-3 border-r-2 border-slate-800 last-of-type:border-r-0 font-bold text-slate-600 hover:bg-slate-100 transition-colors focus:outline-none">
      <
    </button>
  }

  @for (index of visibleTourLogArray; track index) {
    <button
      (click)="selectTourLog(index)"
      [ngClass]="{
      'bg-blue-500 text-white': selectedTourLogIndex === index,
      'text-slate-700 hover:bg-slate-100': selectedTourLogIndex !== index
    }"
      class="px-4 py-3 border-r-2 border-slate-800 last-of-type:border-r-0 font-semibold transition-colors focus:outline-none shrink-0">
      {{ index }}
    </button>
  }

  <button
    (click)="nextGroup()"
    class="px-4 py-3 border-r-2 border-slate-800 last-of-type:border-r-0 font-bold text-slate-600 hover:bg-slate-100 transition-colors focus:outline-none">
    +
  </button>

  @if (hasNext) {
    <button
      (click)="nextGroup()"
      class="px-4 py-3 border-r-2 border-slate-800 last-of-type:border-r-0 font-bold text-slate-600 hover:bg-slate-100 transition-colors focus:outline-none">
      >
    </button>
  }

  <p>{{this.activeTourLog?.comment}}</p>
} @else {
  <div class="w-full h-full flex flex-col items-center justify-center gap-2">
    <p class="text-gray-600 text-center">Select a tour to see details</p>
  </div>
}
